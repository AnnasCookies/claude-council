name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Bun (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure canonical upstream
        run: git remote add upstream https://github.com/hex/claude-council.git

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run check
